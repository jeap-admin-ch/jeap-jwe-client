version: 2
updates:
  # The workspace root: the build, test and lint toolchain, and the lock file the
  # compatibility matrix installs from.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # Two packages are pinned by peer dependencies of the toolchain, not by choice.
    # Proposing them produces a group that cannot even be installed, which takes the
    # other updates in the group down with it. Revisit both when Angular is upgraded.
    ignore:
      # @angular-devkit/build-angular 22 requires typescript ">=6.0 <6.1", so even a
      # minor update is out of reach until Angular 23.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # karma-jasmine-html-reporter 2.2 requires jasmine-core "^4 || ^5 || ^6".
      - dependency-name: "jasmine-core"
        update-types:
          - "version-update:semver-major"

  # The published library manifest. The workspace root is not an npm workspace, so an
  # update of "/" never reaches this file, and the dependencies declared here are the
  # only third-party code that is redistributed to consumers. Peer dependencies are not
  # touched by Dependabot, so the supported Angular range stays a deliberate decision.
  - package-ecosystem: "npm"
    directory: "/projects/jeap-jwe-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      library-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
